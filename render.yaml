# Render Blueprint — AI Legal Consultation & Lawyer Booking Platform
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: legal-platform-db
    databaseName: legal_platform
    user: legal_platform_user
    plan: free

services:
  # Spring Boot API (Docker)
  - type: web
    name: legal-platform-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: legal-platform-db
          property: connectionString
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: legal-platform-db
          property: jdbcConnectionString
      - key: DB_USER
        fromDatabase:
          name: legal-platform-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: legal-platform-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # React + Vite static site
  - type: web
    name: legal-platform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: legal-platform-api
          envVarKey: RENDER_EXTERNAL_URL
